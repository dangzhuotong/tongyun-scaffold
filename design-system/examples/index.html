<!doctype html><html lang="zh-CN" data-ty-theme="paper"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tongyun UI · 组件库</title><link rel="stylesheet" href="../tokens/tokens.css"><link rel="stylesheet" href="../components/ui.css"><style>body{margin:0}.catalog{display:grid;grid-template-columns:220px 1fr;min-height:100vh}aside{padding:28px 20px;border-right:1px solid var(--ty-border)}nav{display:grid;gap:6px;margin-top:32px}nav button{text-align:left;border:0;background:none;padding:10px;color:var(--ty-muted);border-radius:8px;cursor:pointer}nav button[aria-current]{background:var(--ty-raised);color:var(--ty-text)}main{padding:32px 48px;max-width:1100px;width:100%;box-sizing:border-box}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--ty-border);padding-bottom:22px}.intro{margin:45px 0 28px}h1{font-size:30px!important;margin-bottom:10px}.preview{padding:44px;border:1px solid var(--ty-border);border-radius:12px;min-height:190px;display:grid;align-content:center;gap:12px}.preview>*{max-width:420px}.toolbar{display:flex;gap:12px;align-items:center;margin:24px 0}.toolbar select{width:auto}pre{background:var(--ty-raised);padding:24px;border-radius:12px;overflow:auto;font:12px/1.8 var(--ty-font-mono)}footer{margin-top:35px;color:var(--ty-muted);font-size:12px}.brand{font-size:20px;font-weight:500}.brand small{display:block;font-size:12px;color:var(--ty-muted);margin-top:6px}a{color:inherit}@media(max-width:650px){.catalog{grid-template-columns:1fr}aside{border:0;padding:20px}nav{display:flex;flex-wrap:wrap;margin-top:16px}main{padding:20px}.preview{padding:24px}header{gap:12px;flex-wrap:wrap}}</style><body class="ty-root"><div class="catalog"><aside><div class="brand">Tongyun UI<small>橦云通用组件库 · 0.1</small></div><nav aria-label="组件分类"></nav><p class="ty-muted">组件与业务分离</p><a href="planner.html">查看手帐组合示例 ↗</a></aside><main><header><span>组件 / <span id="crumb">Button</span></span><label>主题 <select id="theme" class="ty-select"><option value="paper">Tongyun Light</option><option value="paper-dark">Tongyun Dark</option><option value="cloud">Cloud</option><option value="desktop">Desktop</option></select></label></header><div class="intro"><p class="ty-muted" id="english"></p><h1 id="title"></h1><p class="ty-muted">统一的视觉语言，可独立接入你的产品。</p></div><div class="toolbar"><label>状态 <select id="state" class="ty-select"><option value="default">默认</option><option value="invalid">错误</option><option value="disabled">禁用</option></select></label><button class="ty-button" id="focus">查看焦点</button></div><section class="preview" id="preview" aria-label="组件预览"></section><h2>接入代码</h2><pre><code id="code"></code></pre><footer>Input / Button 使用共享 CSS。Select 预览使用 React + Radix；接入时使用 adapters/select.tsx。业务模板独立存放。</footer></main></div><dialog class="ty-dialog" id="modal" aria-labelledby="modal-title"><h2 id="modal-title">创建项目</h2><p>这是通用对话框，关闭后返回触发位置。</p><form method="dialog"><button class="ty-button">关闭</button></form></dialog><script>const components={"Button":["按钮","<button class=\"ty-button\" data-variant=\"primary\">创建项目</button> <button class=\"ty-button\">取消</button> <button class=\"ty-button\" disabled>不可用</button>"],"Input":["输入框","<div class=\"ty-field\"><label for=\"name\">项目名称</label><input class=\"ty-input\" id=\"name\" placeholder=\"输入项目名称\"><span class=\"ty-muted\">为项目取一个容易辨认的名称。</span></div>"],"Textarea":["文本域","<label for=\"description\">项目描述</label><textarea id=\"description\" class=\"ty-textarea\" placeholder=\"描述你的项目\"></textarea>"],"Select":["选择器","<label for=\"category\">项目类型</label><select class=\"ty-select\" id=\"category\"><option>网站</option><option>桌面应用</option><option>内部工具</option></select>"],"Checkbox":["复选框","<label><input class=\"ty-checkbox\" type=\"checkbox\"> 接收项目更新</label>"],"Card":["卡片","<section class=\"ty-card\"><h3>项目设置</h3><p class=\"ty-muted\">管理项目的名称与访问方式。</p><button class=\"ty-button\">查看设置</button></section>"],"Dialog":["对话框","<button class=\"ty-button\" onclick=\"document.querySelector('#modal').showModal()\">打开对话框</button>"],"Tokens":["设计令牌","<p>控件圆角 8px · 卡片圆角 12px · 默认控件高度 36px</p><p>颜色通过语义角色引用，主题独立于组件行为。</p>"]};let current='Button';const $=s=>document.querySelector(s);function render(){const [title,html]=components[current];$('#title').textContent=title;$('#english').textContent=current;$('#crumb').textContent=current;$('#preview').innerHTML=html;$('#code').textContent=html;$('#state').value='default';document.querySelectorAll('nav button').forEach(b=>b.toggleAttribute('aria-current',b.textContent===current));document.dispatchEvent(new Event('ty:upgrade'));}for(const name of Object.keys(components)){const b=document.createElement('button');b.textContent=name;b.onclick=()=>{current=name;render()};$('nav').append(b)}$('#theme').onchange=e=>document.documentElement.dataset.tyTheme=e.target.value;$('#state').onchange=e=>$('#preview').querySelectorAll('input,textarea,select,button').forEach(el=>{el.disabled=e.target.value==='disabled';el.setAttribute('aria-invalid',String(e.target.value==='invalid'))});$('#focus').onclick=()=>$('#preview').querySelector('input,textarea,button,select')?.focus();render();</script><script defer src="select-preview.js"></script></body></html>
